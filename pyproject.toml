[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-auk"
version = "0.1.0"
description = "Standalone Apple Silicon MLX port of Tencent Hunyuan AuK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mlx>=0.29.0",
  "numpy>=1.26.0",
  "safetensors>=0.4.0",
  "soundfile>=0.12.0",
  "scipy>=1.10.0",
  "pyyaml>=6.0",
  "transformers>=4.52.0",
  "torch>=2.4.0",
  "torchaudio>=2.4.0",
  "huggingface-hub>=0.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5.0"]

[project.scripts]
mlx-auk = "mlx_auk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_auk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
